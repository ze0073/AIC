spring:
  application:
    name: shijie-accessibility
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shijie_accessibility?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:shijie}
    password: ${SPRING_DATASOURCE_PASSWORD:shijie-dev}
    hikari:
      maximum-pool-size: 8
      data-source-properties:
        preserveInstants: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  servlet:
    session:
      cookie:
        name: SHIJIE_PLATFORM_SESSION
  address: ${SERVER_BIND_HOST:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  hosting:
    gateway-port: ${APP_HOSTING_GATEWAY_PORT:8090}
    gateway-bind-host: ${APP_HOSTING_GATEWAY_BIND_HOST:127.0.0.1}
    network-prefix: ${APP_HOSTING_NETWORK_PREFIX:10.253}
  storage-root: ${APP_STORAGE_ROOT:./data}
  security:
    initial-admin-username: ${APP_INITIAL_ADMIN_USERNAME:admin}
    initial-admin-password: ${APP_INITIAL_ADMIN_PASSWORD:change-me-on-first-run}
    initial-admin-display-name: ${APP_INITIAL_ADMIN_DISPLAY_NAME:系统管理员}
    credential-key: ${APP_CREDENTIAL_KEY:local-development-key-change-before-deployment}
  tools:
    zap-image: ${ZAP_IMAGE:zaproxy/zap-stable:2.16.1}
    k6-image: ${K6_IMAGE:grafana/k6:0.57.0}
  scanner:
    max-pages: ${SCANNER_MAX_PAGES:10}
    page-timeout-ms: ${SCANNER_PAGE_TIMEOUT_MS:10000}
    total-timeout-ms: ${SCANNER_TOTAL_TIMEOUT_MS:60000}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:qwen}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen3-vl-plus}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
    max-retries: ${AI_MAX_RETRIES:1}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
