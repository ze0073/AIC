<!doctype html><html><body>
<template data-expect="hit" data-case="flex-order"><div style="display:flex"><button style="order:4">一</button><button style="order:3">二</button><button style="order:2">三</button><button style="order:1">四</button></div></template>
<template data-expect="hit" data-case="row-reverse"><div style="display:flex;flex-direction:row-reverse"><a href="#">一</a><a href="#">二</a><a href="#">三</a><a href="#">四</a></div></template>
<template data-expect="hit" data-case="grid-areas"><div style="display:grid;grid-template-columns:repeat(2,180px)"><button style="grid-area:2/2">一</button><button style="grid-area:2/1">二</button><button style="grid-area:1/2">三</button><button style="grid-area:1/1">四</button></div></template>
<template data-expect="hit" data-case="absolute-columns"><div style="position:relative;height:180px"><button style="position:absolute;top:120px;left:220px">一</button><button style="position:absolute;top:120px;left:20px">二</button><button style="position:absolute;top:20px;left:220px">三</button><button style="position:absolute;top:20px;left:20px">四</button></div></template>
<template data-expect="hit" data-case="column-reverse"><div style="display:flex;flex-direction:column-reverse"><p>一</p><p>二</p><p>三</p><p>四</p></div></template>
<template data-expect="hit" data-case="rtl-order"><style>html{direction:rtl}</style><div style="display:flex"><button style="order:4">一</button><button style="order:3">二</button><button style="order:2">三</button><button style="order:1">四</button></div></template>
<template data-expect="hit" data-case="responsive-order"><style>@media(min-width:700px){.responsive{display:flex}.responsive button:nth-child(1){order:4}.responsive button:nth-child(2){order:3}.responsive button:nth-child(3){order:2}.responsive button:nth-child(4){order:1}}</style><div class="responsive"><button>一</button><button>二</button><button>三</button><button>四</button></div></template>
<template data-expect="hit" data-case="grid-order"><div style="display:grid;grid-template-columns:repeat(4,100px)"><a href="#" style="order:4">一</a><a href="#" style="order:3">二</a><a href="#" style="order:2">三</a><a href="#" style="order:1">四</a></div></template>
<template data-expect="hit" data-case="same-line-absolute"><div style="position:relative;height:70px"><button style="position:absolute;left:330px">一</button><button style="position:absolute;left:220px">二</button><button style="position:absolute;left:110px">三</button><button style="position:absolute;left:0">四</button></div></template>
<template data-expect="hit" data-case="nested-flex"><div style="display:flex"><div style="order:2"><button>一</button><button>二</button></div><div style="order:1"><button>三</button><button>四</button></div></div></template>

<template data-expect="pass" data-case="document-flow"><h1>标题</h1><p>第一段</p><p>第二段</p><a href="#">继续</a></template>
<template data-expect="pass" data-case="flex-natural"><div style="display:flex"><button>一</button><button>二</button><button>三</button><button>四</button></div></template>
<template data-expect="pass" data-case="grid-natural"><div style="display:grid;grid-template-columns:repeat(2,180px)"><button>一</button><button>二</button><button>三</button><button>四</button></div></template>
<template data-expect="pass" data-case="absolute-natural"><div style="position:relative;height:180px"><button style="position:absolute;top:20px;left:20px">一</button><button style="position:absolute;top:20px;left:220px">二</button><button style="position:absolute;top:120px;left:20px">三</button><button style="position:absolute;top:120px;left:220px">四</button></div></template>
<template data-expect="pass" data-case="single-inversion"><div style="position:relative;height:60px"><button style="position:absolute;left:100px">一</button><button style="position:absolute;left:12px">二</button><button style="position:absolute;left:188px">三</button><button style="position:absolute;left:276px">四</button></div></template>
<template data-expect="pass" data-case="too-few"><div style="display:flex;flex-direction:row-reverse"><button>一</button><button>二</button><button>三</button></div></template>
<template data-expect="pass" data-case="hidden-reorder"><div style="display:flex"><button>一</button><button>二</button><button>三</button><button>四</button><button style="display:none;order:-1">隐藏</button></div></template>
<template data-expect="pass" data-case="rtl-natural"><style>html{direction:rtl}</style><div style="display:flex"><button>一</button><button>二</button><button>三</button><button>四</button></div></template>
<template data-expect="pass" data-case="vertical-unsupported"><style>html{writing-mode:vertical-rl}</style><h1>标题</h1><p>一</p><p>二</p><a href="#">三</a></template>
<template data-expect="pass" data-case="responsive-natural"><style>@media(max-width:699px){.normal{display:flex;flex-direction:column-reverse}}</style><div class="normal"><button>一</button><button>二</button><button>三</button><button>四</button></div></template>
</body></html>
